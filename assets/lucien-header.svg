<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Lucien Marek Sol — Interface Specialist</title>
  <desc id="desc">Amber interface-system profile banner for Kirion-Lucien.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c0f"/>
      <stop offset="48%" stop-color="#17140b"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>

    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7c948"/>
      <stop offset="55%" stop-color="#ffb21a"/>
      <stop offset="100%" stop-color="#ffe7a3"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffbf24" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#ffbf24" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#f0c35a" stroke-opacity=".08" stroke-width="1"/>
    </pattern>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="32" r="250" fill="url(#glow)"/>
  <circle cx="145" cy="342" r="210" fill="url(#glow)" opacity=".55"/>

  <!-- layout/frame motif -->
  <g transform="translate(54 64)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="230" height="202" rx="22" stroke="#f5c650" stroke-width="2.5" opacity=".92"/>
    <rect x="18" y="18" width="194" height="28" rx="8" stroke="#ffe09a" stroke-width="2" opacity=".68"/>
    <rect x="18" y="62" width="58" height="120" rx="10" stroke="#f5c650" stroke-width="2" opacity=".74"/>
    <rect x="92" y="62" width="120" height="52" rx="10" stroke="#ffb21a" stroke-width="2.5"/>
    <rect x="92" y="130" width="56" height="52" rx="10" stroke="#ffe09a" stroke-width="2" opacity=".76"/>
    <rect x="164" y="130" width="48" height="52" rx="10" stroke="#f5c650" stroke-width="2" opacity=".64"/>
    <circle cx="196" cy="32" r="5" fill="#ffb21a" stroke="none"/>
    <path d="M12 196H42M188 196H218M-6 18V48M236 154V184" stroke="#ffcc58" stroke-width="3"/>
  </g>

  <g filter="url(#shadow)">
    <text x="330" y="93" fill="#e6be57" font-family="Trebuchet MS, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">KIRION-LUCIEN  ·  THE SMITHY</text>
    <text x="326" y="158" fill="url(#amber)" font-family="Trebuchet MS, Arial, sans-serif" font-size="51" font-weight="800">Lucien Marek Sol</text>
    <text x="330" y="201" fill="#fff8e7" font-family="Trebuchet MS, Arial, sans-serif" font-size="25" font-weight="700">INTERFACE SPECIALIST</text>
    <text x="330" y="236" fill="#f5ca63" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.6">UI/UX SYSTEMS  ·  FRONTEND ENGINEERING  ·  PRODUCT EXPERIENCE</text>
  </g>

  <!-- inspector card -->
  <g filter="url(#shadow)">
    <rect x="845" y="77" width="305" height="185" rx="20" fill="#12110d" stroke="#dba929" stroke-width="2"/>
    <text x="870" y="110" fill="#ffe7a3" font-family="Consolas, monospace" font-size="15">FRAME INSPECTOR</text>
    <line x1="870" y1="124" x2="1125" y2="124" stroke="#735c22" stroke-width="1"/>
    <text x="870" y="153" fill="#f2bf42" font-family="Consolas, monospace" font-size="15">hierarchy     clear</text>
    <text x="870" y="181" fill="#f4d989" font-family="Consolas, monospace" font-size="15">interaction   intentional</text>
    <text x="870" y="209" fill="#f2bf42" font-family="Consolas, monospace" font-size="15">accessibility required</text>
    <text x="870" y="237" fill="#fff2c7" font-family="Consolas, monospace" font-size="15">status        shaping...</text>
  </g>

  <rect x="329" y="278" width="494" height="3" rx="2" fill="url(#amber)" opacity=".86"/>
  <text x="330" y="307" fill="#e5c66f" font-family="Consolas, monospace" font-size="14" letter-spacing="2">INTERFACES THAT EXPLAIN THEMSELVES.</text>
</svg>
