<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
<title id="title">Lucien Frames — composable interface operating contexts</title>
<desc id="desc">Eight independent operating contexts connect to a shared interface discipline without pairwise opposition, with a multi-context example demonstrating composability.</desc>
<rect width="1440" height="980" fill="#0B0C0F"/>
<text x="64" y="76" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="32" font-weight="700" letter-spacing="3">03 / FRAMES</text>
<text x="64" y="166" fill="#F4F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="70">ONE INTERFACE DISCIPLINE.</text>
<text x="64" y="226" fill="#AAA598" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Independent contexts can combine. The constraints do not cancel each other out.</text>

