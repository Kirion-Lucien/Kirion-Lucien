<rect x="525" y="350" width="390" height="195" rx="24" fill="#15140F" stroke="#F4F1E8" stroke-width="3"/>
<text x="720" y="423" text-anchor="middle" fill="#F4F1E8" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700">INTERFACE</text>
<text x="720" y="480" text-anchor="middle" fill="#F4F1E8" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700">DISCIPLINE</text>
<text x="720" y="520" text-anchor="middle" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="20">same craft · composable contexts</text>

<g fill="#F4F1E8" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">
  <text x="72" y="345">PUBLIC SERVICE</text>
  <text x="132" y="515">MOBILE</text>
  <text x="88" y="660">DATA-DENSE</text>
  <text x="398" y="750">KIOSK / POS</text>
  <text x="1080" y="325">OPERATIONS</text>
  <text x="1115" y="505">DESKTOP</text>
  <text x="1085" y="640">REALTIME</text>
  <text x="905" y="750">OFFLINE / DEGRADED</text>
</g>

<rect x="64" y="820" width="1312" height="112" rx="18" fill="#101116" stroke="#3B382E"/>
<text x="94" y="862" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700">COMPOSABLE EXAMPLE</text>
<text x="94" y="905" fill="#F4F1E8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="22">PUBLIC SERVICE + MOBILE + DATA-DENSE + REALTIME + OFFLINE-CAPABLE</text>
<text x="915" y="860" fill="#AAA598" font-family="Arial, Helvetica, sans-serif" font-size="22">I use frames to decide what stays visible,</text>
<text x="915" y="895" fill="#AAA598" font-family="Arial, Helvetica, sans-serif" font-size="22">what can collapse, and what must recover.</text>
</svg>