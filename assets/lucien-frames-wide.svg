<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Lucien Frames — composable interface operating contexts</title>
<desc id="desc">Eight independent operating contexts orbit a shared interface discipline, with a multi-context example demonstrating composability.</desc>
<rect width="1440" height="900" fill="#0B0C0F"/>
<text x="64" y="76" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="32" font-weight="700">03 / FRAMES</text>
<text x="64" y="166" fill="#F4F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="70">ONE INTERFACE DISCIPLINE.</text>
<text x="64" y="226" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Different operating constraints.</text>
<g>
  <rect x="525" y="350" width="390" height="190" rx="24" fill="#15140F" stroke="#F4F1E8" stroke-width="3"/>
  <text x="720" y="423" text-anchor="middle" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="47" font-weight="700">INTERFACE</text>
  <text x="720" y="480" text-anchor="middle" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="47" font-weight="700">DISCIPLINE</text>
  <text x="720" y="520" text-anchor="middle" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="20">same craft · composable contexts</text>
</g>
<path d="M 382 330 L 453 330 L 453 382 L 525 382" fill="none" stroke="#6C6659" stroke-width="2"/>
<circle cx="525" cy="382" r="7" fill="#F5C451"/>
<text x="82" y="320" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">PUBLIC SERVICE</text>
<path d="M 1030 322 L 972 322 L 972 382 L 915 382" fill="none" stroke="#6C6659" stroke-width="2"/>
<circle cx="915" cy="382" r="7" fill="#F5C451"/>
<text x="1030" y="312" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">OPERATIONS</text>
<path d="M 402 496 L 463 496 L 463 435 L 525 435" fill="none" stroke="#6C6659" stroke-width="2"/>
<circle cx="525" cy="435" r="7" fill="#F5C451"/>
<text x="102" y="486" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">MOBILE</text>
<path d="M 1110 484 L 1012 484 L 1012 435 L 915 435" fill="none" stroke="#6C6659" stroke-width="2"/>
<circle cx="915" cy="435" r="7" fill="#F5C451"/>
<text x="1110" y="474" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">DESKTOP</text>
<path d="M 450 665 L 487 665 L 487 490 L 525 490" fill="none" stroke="#6C6659" stroke-width="2"/>
<circle cx="525" cy="490" r="7" fill="#F5C451"/>
<text x="150" y="655" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">DATA-DENSE</text>
<path d="M 1080 650 L 997 650 L 997 490 L 915 490" fill="none" stroke="#6C6659" stroke-width="2"/>
<circle cx="915" cy="490" r="7" fill="#F5C451"/>
<text x="1080" y="640" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">REALTIME</text>
<path d="M 730 760 L 670 760 L 670 540 L 610 540" fill="none" stroke="#6C6659" stroke-width="2"/>
<circle cx="610" cy="540" r="7" fill="#F5C451"/>
<text x="430" y="750" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">KIOSK / POS</text>
<path d="M 900 760 L 900 760 L 900 540 L 830 540" fill="none" stroke="#6C6659" stroke-width="2"/>
<circle cx="830" cy="540" r="7" fill="#F5C451"/>
<text x="820" y="750" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">OFFLINE / DEGRADED</text>
<rect x="64" y="742" width="560" height="108" rx="18" fill="#101116" stroke="#3B382E"/>
<text x="92" y="784" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700">ONE SYSTEM CAN BE</text>
<text x="92" y="823" fill="#F4F1E8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="19">PUBLIC SERVICE + MOBILE + DATA-DENSE + REALTIME + OFFLINE</text>
<text x="1010" y="806" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24">I use frames to decide what stays visible,</text>
<text x="1010" y="840" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24">what can collapse, and what must recover.</text>
</svg>