<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Lucien Interface — identity and interface-design principles</title>
<desc id="desc">Interface doctrine visual organizing priority, state, recovery, and context around the human-facing boundary.</desc>
<rect width="1440" height="820" fill="#0B0C0F"/>
<text x="64" y="76" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="32" font-weight="700" letter-spacing="3">01 / INTERFACE</text>
<text x="64" y="183" fill="#F4F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="88">CLARITY IS PART</text>
<text x="64" y="278" fill="#F4F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="88">OF CORRECTNESS.</text>
<text x="68" y="340" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="34" font-weight="700">I shape the human-facing boundary.</text>
<line x1="64" y1="392" x2="835" y2="392" stroke="#B98518" stroke-width="3"/>
<text x="64" y="442" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="29">The interface has to explain four things before decoration matters:</text>
<g font-family="Inter, Arial, Helvetica, sans-serif">
  <text x="64" y="520" fill="#B98518" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="27" font-weight="700">01</text>
  <text x="122" y="520" fill="#F4F1E8" font-size="38" font-weight="700">PRIORITY</text>
  <text x="330" y="520" fill="#AAA598" font-size="28">what deserves attention now</text>
  <text x="64" y="592" fill="#B98518" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="27" font-weight="700">02</text>
  <text x="122" y="592" fill="#F4F1E8" font-size="38" font-weight="700">STATE</text>
  <text x="330" y="592" fill="#AAA598" font-size="28">what changed and what it means</text>
  <text x="64" y="664" fill="#B98518" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="27" font-weight="700">03</text>
  <text x="122" y="664" fill="#F4F1E8" font-size="38" font-weight="700">RECOVERY</text>
  <text x="330" y="664" fill="#AAA598" font-size="28">what happens when the ideal path breaks</text>
  <text x="64" y="736" fill="#B98518" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="27" font-weight="700">04</text>
  <text x="122" y="736" fill="#F4F1E8" font-size="38" font-weight="700">CONTEXT</text>
  <text x="330" y="736" fill="#AAA598" font-size="28">people · task · device · conditions</text>
</g>
<line x1="930" y1="128" x2="930" y2="695" stroke="#3B382E" stroke-width="3"/>
<text x="967" y="157" fill="#AAA598" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="25" letter-spacing="2">SYSTEM INTENT</text>
