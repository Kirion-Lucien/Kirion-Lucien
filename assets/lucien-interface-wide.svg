<text x="1002" y="253" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">structure</text>
<text x="1096" y="360" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">interaction</text>
<text x="1025" y="467" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">hierarchy</text>
<text x="1130" y="574" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">implementation</text>
<text x="966" y="680" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="25" letter-spacing="2">HUMAN UNDERSTANDING</text>
<text x="965" y="728" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25">responsive behavior · accessibility · feedback</text>
</svg>