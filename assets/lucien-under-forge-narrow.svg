<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1810" viewBox="0 0 820 1810" role="img" aria-labelledby="title desc">
<title id="title">Lucien Under Forge — narrow composition</title>
<desc id="desc">Narrow governed specialization systems and frontend engineering intelligence loop.</desc>
<rect width="820" height="1810" fill="#0B0C0F"/>
<text x="48" y="72" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="34" font-weight="700">05 / UNDER FORGE</text>
<text x="48" y="164" fill="#F4F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="64">GOVERNED</text><text x="48" y="232" fill="#F4F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="64">EVOLUTION.</text>
<text x="48" y="276" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28">Nothing becomes doctrine merely because it</text><text x="48" y="314" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28">was written down.</text>
<rect x="48" y="378" width="724" height="315" rx="18" fill="#15140F" stroke="#3B382E"/>
<text x="78" y="438" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="37" font-weight="700">FRONTEND UI/UX FORGE</text>
<rect x="78" y="475" width="17" height="17" transform="rotate(45 86.5 483.5)" fill="#F5C451"/><text x="118" y="496" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="29" font-weight="700">UNDER FORGE</text>
<text x="78" y="558" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30">I acquire, test, classify, and refine</text><text x="78" y="600" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30">interface-engineering knowledge</text><text x="78" y="642" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30">for reusable judgment.</text>
<rect x="48" y="730" width="724" height="405" rx="18" fill="#15140F" stroke="#3B382E"/>
<text x="78" y="790" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="37" font-weight="700">UI/UX MASTER</text>
<rect x="78" y="827" width="17" height="17" transform="rotate(45 86.5 835.5)" fill="#F5C451"/><text x="118" y="848" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="29" font-weight="700">UNDER FORGE</text>
<text x="78" y="910" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30">I consolidate accepted architecture</text><text x="78" y="952" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30">hierarchy and interaction</text><text x="78" y="994" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30">design-system discipline and accessibility</text><text x="78" y="1036" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30">implementation judgment.</text>
<text x="48" y="1205" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="27" font-weight="700">FRONTEND ENGINEERING</text><text x="48" y="1244" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="27" font-weight="700">INTELLIGENCE FORGE</text>
<text x="48" y="1310" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">I maintain a governed evidence-to-</text><text x="48" y="1351" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">implementation loop that feeds accepted findings</text><text x="48" y="1392" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">back into how I build.</text>
<line x1="88" y1="1495" x2="732" y2="1495" stroke="#6C6659" stroke-width="3"/>
<g fill="#F5C451"><circle cx="100" cy="1495" r="7"/><circle cx="255" cy="1495" r="7"/><circle cx="410" cy="1495" r="7"/><circle cx="565" cy="1495" r="7"/><circle cx="720" cy="1495" r="7"/></g>
<g fill="#F4F1E8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="21"><text x="58" y="1455">EVIDENCE</text><text x="219" y="1455">ANALYSIS</text><text x="363" y="1455">EXPERIMENT</text><text x="522" y="1455">IMPLEMENT</text><text x="684" y="1455">REVIEW</text></g>
<path d="M720 1515 C720 1585 100 1585 100 1515" fill="none" stroke="#B98518" stroke-width="3"/>
<text x="48" y="1635" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28">Accepted findings feed future frontend decisions.</text><text x="48" y="1675" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28">Rejected assumptions do not become authority.</text>
<text x="48" y="1760" fill="#F4F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="34">Still under forge. Still being refined.</text>
</svg>