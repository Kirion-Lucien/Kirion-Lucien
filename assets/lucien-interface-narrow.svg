<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1220" viewBox="0 0 820 1220" role="img" aria-labelledby="title desc">
<title id="title">Lucien Interface — narrow composition</title>
<desc id="desc">Narrow interface doctrine visual with priority, state, recovery, and context organized for mobile reading.</desc>
<rect width="820" height="1220" fill="#0B0C0F"/>
<text x="48" y="72" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="34" font-weight="700" letter-spacing="2">01 / INTERFACE</text>
<text x="48" y="168" fill="#F4F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="72">CLARITY IS PART</text>
<text x="48" y="246" fill="#F4F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="72">OF CORRECTNESS.</text>
<text x="50" y="310" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="30" font-weight="700">I shape the human-facing boundary.</text>
<line x1="48" y1="358" x2="772" y2="358" stroke="#B98518" stroke-width="3"/>
