  <text x="48" y="565" fill="#B98518" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="28" font-weight="700">02</text><text x="108" y="565" fill="#F4F1E8" font-size="38" font-weight="700">STATE</text><text x="108" y="607" fill="#AAA598" font-size="31">what changed and what it means</text>
  <line x1="108" y1="631" x2="770" y2="631" stroke="#3B382E"/>
  <text x="48" y="700" fill="#B98518" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="28" font-weight="700">03</text><text x="108" y="700" fill="#F4F1E8" font-size="38" font-weight="700">RECOVERY</text><text x="108" y="742" fill="#AAA598" font-size="31">what happens when the ideal path breaks</text>
  <line x1="108" y1="766" x2="770" y2="766" stroke="#3B382E"/>
  <text x="48" y="835" fill="#B98518" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="28" font-weight="700">04</text><text x="108" y="835" fill="#F4F1E8" font-size="38" font-weight="700">CONTEXT</text><text x="108" y="877" fill="#AAA598" font-size="31">people · task · device · conditions</text>
