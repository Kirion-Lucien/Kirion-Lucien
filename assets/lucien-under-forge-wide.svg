<text x="96" y="458" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25">I acquire, test, classify, and refine</text><text x="96" y="493" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25">interface-engineering knowledge for reuse.</text>
