<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
<title id="title">Lucien Craft — interface design and frontend engineering principles</title>
<desc id="desc">Five craft principles with failure-state thinking and a restrained implementation surface.</desc>
<rect width="1440" height="920" fill="#0B0C0F"/>
<text x="64" y="76" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="32" font-weight="700">04 / CRAFT</text>
<text x="64" y="166" fill="#F4F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="74">DECISIONS BEFORE DECORATION.</text>
<line x1="855" y1="118" x2="855" y2="835" stroke="#3B382E" stroke-width="2"/>
<text x="64" y="300" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="700">HIERARCHY</text><text x="420" y="300" fill="#AAA598" font-family="Georgia, 'Times New Roman', serif" font-size="37">before decoration.</text>
<text x="64" y="410" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="700">STATE</text><text x="420" y="410" fill="#AAA598" font-family="Georgia, 'Times New Roman', serif" font-size="37">before animation.</text>
<text x="64" y="520" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="700">ACCESSIBILITY</text><text x="420" y="520" fill="#AAA598" font-family="Georgia, 'Times New Roman', serif" font-size="37">before cleverness.</text>
<text x="64" y="630" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="700">CONSISTENCY</text><text x="420" y="630" fill="#AAA598" font-family="Georgia, 'Times New Roman', serif" font-size="37">before novelty.</text>
<text x="64" y="740" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="700">EVIDENCE</text><text x="420" y="740" fill="#AAA598" font-family="Georgia, 'Times New Roman', serif" font-size="37">before preference.</text>
<text x="915" y="245" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="25" font-weight="700">WHEN THE IDEAL PATH BREAKS</text>
<text x="915" y="305" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">loading</text><text x="1160" y="305" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">error</text>
<text x="915" y="365" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">permission</text><text x="1160" y="365" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">retry</text>
<text x="915" y="425" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">disabled</text><text x="1160" y="425" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">focus</text>
<text x="915" y="485" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">responsive</text><text x="1160" y="485" fill="#F4F1E8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="700">semantic</text>
<line x1="915" y1="535" x2="1360" y2="535" stroke="#B98518" stroke-width="3"/>
<text x="915" y="584" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26">A polished ideal path is not enough.</text>
<text x="915" y="622" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26">The system still has to explain itself</text>
<text x="915" y="660" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26">when data, access, or connectivity changes.</text>
<text x="64" y="850" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="24">HTML · CSS · JavaScript · TypeScript · React</text>
<text x="64" y="890" fill="#F4F1E8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="22">components · tokens · state · responsive systems · testing</text>
</svg>