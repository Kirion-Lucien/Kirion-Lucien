<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1530" viewBox="0 0 820 1530" role="img" aria-labelledby="title desc">
<title id="title">Lucien Frames — narrow composable contexts</title>
<desc id="desc">Narrow constellation of eight independent operating contexts around a shared interface discipline.</desc>
<rect width="820" height="1530" fill="#0B0C0F"/>
<text x="48" y="72" fill="#F5C451" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="34" font-weight="700">03 / FRAMES</text>
<text x="48" y="164" fill="#F4F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="66">ONE INTERFACE</text>
<text x="48" y="235" fill="#F4F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="66">DISCIPLINE.</text>
<text x="48" y="292" fill="#AAA598" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Different operating constraints.</text>
